<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <p>Browse my work by category.</p>
    <div class="auth-bar">
      <span id="auth-status"></span>
      <button type="button" id="auth-btn" class="ghost">Owner sign in</button>
    </div>
  </header>

  <main id="main" class="viewer">
    <!-- Only shown after the owner signs in -->
    <section class="card" id="form-card" hidden>
      <h2 id="form-title">Add a project</h2>
      <form id="project-form">
        <input type="hidden" id="project-id" />

        <label>Title
          <input type="text" id="title" required maxlength="120" />
        </label>

        <label>Category
          <select id="category" required>
            <option value="">Choose a category...</option>
          </select>
        </label>

        <label>Description
          <textarea id="description" rows="3" maxlength="2000"></textarea>
        </label>

        <label>Tags (comma separated)
          <input type="text" id="tags" placeholder="javascript, api" />
        </label>

        <label>Link
          <input type="url" id="link" placeholder="https://..." />
        </label>

        <label>Thumbnail image URL (optional, https only)
          <input type="url" id="image-url" placeholder="https://..." />
        </label>

        <label>Year (optional, 1900-2100)
          <input type="number" id="year" min="1900" max="2100" step="1" />
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="featured" />
          Featured project
        </label>

        <div class="actions">
          <button type="submit">Save project</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search title or tags..." />
        <button type="button" id="export-btn" class="ghost">Export JSON</button>
        <button type="button" id="clear-all-btn" class="danger" hidden>Clear all</button>
      </div>
      <div id="tabs" class="tabs"></div>
      <h2 class="category-count-heading">Projects by category</h2>
      <ul id="category-counts" class="category-counts"></ul>
      <p id="count"></p>
      <div id="project-list"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
